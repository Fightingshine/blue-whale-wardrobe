name: 发布皮肤图鉴
on:
  push:
    branches: [main]
  issues:
    types: [labeled, unlabeled, edited, closed, reopened, deleted]
  workflow_dispatch:
permissions:
  contents: read
  issues: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'issues' || contains(github.event.issue.labels.*.name, '已收录') || github.event.label.name == '已收录'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
        env:
          VITE_SUBMIT_API_URL: ${{ vars.VITE_SUBMIT_API_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
      - name: 同步已收录的皮肤投稿
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/sync-approved-issues.mjs --out dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署静态站点
        id: deployment
        uses: actions/deploy-pages@v4
